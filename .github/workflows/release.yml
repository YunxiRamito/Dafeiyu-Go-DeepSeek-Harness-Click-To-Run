name: manual-release-validation

# Releases are accepted and published locally. Tags/pushes never start this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Local acceptance pipeline (verification only)
        shell: pwsh
        run: |
          # Runner workspace is on D:. No npm/Release publication, tag or manifest writes.
          $work = Join-Path $env:GITHUB_WORKSPACE 'Temp_SetupandLauncher/ManualValidation'
          ./release.ps1 -NoManifest -WorkRoot $work -DotnetPath (Get-Command dotnet).Source -Proxy ''

      - name: Upload verified ZIP and acceptance receipt
        uses: actions/upload-artifact@v7
        with:
          name: Dafeiyu-Go-Manual-Validation-${{ github.run_id }}
          path: |
            Temp_SetupandLauncher/ManualValidation/*/DeepSeekHarness-*.zip
            Temp_SetupandLauncher/ManualValidation/*/acceptance.json
          if-no-files-found: error
          retention-days: 7
